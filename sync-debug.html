<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supabase Sync Test V2</title>
<style>
body{font-family:Arial,sans-serif;background:#07182b;color:#f0e6d2;padding:30px}main{max-width:680px;margin:auto}input,button{display:block;width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{background:#f1b667;border:0;font-weight:700;cursor:pointer}pre{white-space:pre-wrap;background:#0d2540;padding:14px;border:1px solid #31506d}
</style>
</head>
<body>
<main>
<h1>Supabase 工作室同步测试 V2</h1>
<p id="user">脚本已加载，等待测试。</p>
<input id="studio-id" value="ST-DEBUG-0001">
<input id="studio-name" value="郝梦天测试">
<button id="test-button" type="button">测试写入 Supabase</button>
<pre id="result">点击按钮开始测试。</pre>
</main>
<script>
window.addEventListener('error', (event) => {
  document.getElementById('result').textContent = '页面脚本错误：\n' + event.message;
});
document.getElementById('test-button').addEventListener('click', async () => {
  const result = document.getElementById('result');
  const userBox = document.getElementById('user');
  result.textContent = '正在加载 Supabase...';
  try {
    const module = await import('./supabase.js');
    const supabase = module.supabase;
    if (!supabase) {
      result.textContent = '失败：supabase.js 没有成功初始化，请检查 Root supabase.js 中的 Publishable key。';
      return;
    }
    result.textContent = '正在读取登录状态...';
    const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
    if (sessionError) { result.textContent = '读取登录状态失败：\n' + JSON.stringify(sessionError, null, 2); return; }
    const user = sessionData?.session?.user;
    if (!user) { userBox.textContent = '未登录：请先在游戏页面登录。'; result.textContent = '失败：当前浏览器没有 Supabase 登录会话。'; return; }
    userBox.textContent = '已登录：' + user.email + ' / ' + user.id;
    const id = document.getElementById('studio-id').value.trim();
    const name = document.getElementById('studio-name').value.trim();
    result.textContent = '正在写入...';
    const { data, error } = await supabase.from('studios').upsert({
      id, name, type: 'content', owner_id: user.id, check_in_time: '09:00', office_layout: 'default'
    }).select('*');
    result.textContent = error ? '失败：\n' + JSON.stringify(error, null, 2) : '成功：\n' + JSON.stringify(data, null, 2);
  } catch (error) {
    result.textContent = '异常：\n' + String(error.stack || error.message || error);
  }
});
</script>
</body>
</html>
